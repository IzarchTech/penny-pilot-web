name: Release 📦

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code 👨‍💻
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false # Important for @semantic-release/git

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build & Check
        run: |
          npm run lint
          npm run check

      - name: Create release 🚀
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npx semantic-release
